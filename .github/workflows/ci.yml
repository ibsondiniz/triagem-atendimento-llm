name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q   # offline: keyword baseline and a faked Ollama, never a paid or rate-limited API
      - run: docker build -t triagem .
